<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Scene 5 – Intelligence Emerges</title>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
	<style>
		* { margin:0; padding:0; box-sizing:border-box; font-family:"Helvetica Neue", Arial, sans-serif; }
		body { width:1920px; height:1080px; background:linear-gradient(135deg,#0f0f0f 0%,#1e1e1e 100%); overflow:hidden; color:#fff; }
		.center-text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:64px; font-weight:700; text-align:center; line-height:1.25; letter-spacing:1px; }
		.step { display:block; opacity:0; transform:translateY(40px); }
		.lower-third { position:absolute; bottom:0; left:0; width:1920px; height:120px; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; font-size:32px; color:#e0e0e0; padding:0 60px; }
		.logo { position:absolute; bottom:140px; right:60px; width:180px; height:60px; background:#ffffff; border-radius:8px; opacity:0; }
	</style>
</head>
<body>

	<div class="center-text">
		<span class="step clip" data-start="0.5" data-duration="1.5" data-track-index="1">Neurons</span>
		<span class="step clip" data-start="1.3" data-duration="1.5" data-track-index="2">→ Forward Pass</span>
		<span class="step clip" data-start="2.1" data-duration="1.5" data-track-index="3">→ Back-Prop</span>
		<span class="step clip" data-start="2.9" data-duration="1.5" data-track-index="4">→ Smarter Machine</span>
	</div>

	<div class="lower-third clip" data-start="0" data-duration="8" data-track-index="5">
		That’s it! Neurons, forward passes, and tiny weight tweaks—repeat millions of times and you’ve got intelligence.
	</div>

	<div class="logo clip" data-start="5.5" data-duration="2.5" data-track-index="6"></div>

	<script>
		window.__timelines = window.__timelines || [];

		// Steps pop-in
		const steps = document.querySelectorAll('.step');
		steps.forEach(el => {
			const tl = gsap.timeline({delay:parseFloat(el.dataset.start)});
			tl.to(el, {opacity:1, y:0, duration:0.5, ease:"back.out(1.7)"});
		});

		// Logo fade-in then fade-out
		const logo = document.querySelector('.logo');
		const logoTl = gsap.timeline({delay:parseFloat(logo.dataset.start)});
		logoTl
			.to(logo, {opacity:0.9, duration:0.6, ease:"power2.out"})
			.to(logo, {opacity:0, duration:0.6, ease:"power2.in"}, "+=1.3");

		window.__timelines.push(gsap.timeline());
	</script>
</body>
</html>
