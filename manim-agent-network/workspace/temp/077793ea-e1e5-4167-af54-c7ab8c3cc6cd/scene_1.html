<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Binary Search Scene 1</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:linear-gradient(135deg,#0f0f0f 0%,#1a1a1a 100%);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .clip{position:absolute}
  #title{font-size:120px;font-weight:700;color:#ffffff;text-shadow:0 0 40px rgba(255,255,255,0.15);top:50%;left:50%;transform:translate(-50%,-50%)}
  #subtitle{font-size:48px;font-weight:600;color:#00ffff;top:60%;left:50%;transform:translate(-50%,100%);opacity:0;text-shadow:0 0 20px rgba(0,255,255,0.4)}
  #lowerBar{width:100%;height:120px;background:linear-gradient(90deg,rgba(0,0,0,0.6),rgba(0,0,0,0.8));bottom:0;left:0;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px)}
  #narrationText{font-size:36px;color:#ffffff;font-weight:500;text-align:center;padding:0 60px}
</style>
</head>
<body>

<div id="title" class="clip" data-start="0.5" data-duration="1.3" data-track-index="1">Binary Search in 60s</div>
<div id="subtitle" class="clip" data-start="1.2" data-duration="1.6" data-track-index="2">Fast Lookup in Sorted Data</div>
<div id="lowerBar" class="clip" data-start="0" data-duration="5" data-track-index="3">
  <span id="narrationText">Binary search: find any number in a sorted list in just a few steps.</span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  gsap.registerPlugin();

  const tl = gsap.timeline({delay:0});

  tl.from("#title", {
    opacity:0,
    scale:0.7,
    duration:0.3,
    ease:"power2.out"
  })
  .to("#title", {
    scale:1.05,
    duration:0.15,
    ease:"elastic.out(1,0.3)"
  })
  .to("#title", {
    scale:1,
    duration:0.15,
    ease:"power2.in"
  })
  .to("#title", {
    opacity:1,
    duration:0.7
  }, "-=0.15");

  tl.from("#subtitle", {
    y:"+=80",
    opacity:0,
    duration:0.6,
    ease:"power2.out"
  }, "-=0.3");

  window.__timelines = window.__timelines || [];
  window.__timelines.push(tl);
</script>
</body>
</html>
