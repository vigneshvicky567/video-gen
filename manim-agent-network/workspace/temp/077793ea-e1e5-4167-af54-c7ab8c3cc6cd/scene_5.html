<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scene 5 – Keep Data Sorted</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  .stage{position:absolute;top:0;left:0;width:1920px;height:1080px;background:radial-gradient(circle at center,#1a1a1a 0%,#0f0f0f 100%)}
  .center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;font-family:"Helvetica Neue",Arial,sans-serif}
  .title{font-size:90px;font-weight:700;color:#ffffff;letter-spacing:2px}
  .subtitle{font-size:48px;font-weight:400;color:#00e5ff;margin-top:20px}
  .lower-third{position:absolute;bottom:0;left:0;right:0;height:140px;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:42px;color:#ffffff;font-family:"Helvetica Neue",Arial,sans-serif}
  .logo{position:absolute;bottom:40px;right:60px;width:160px;height:160px;background:#00e5ff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:64px;color:#000000;opacity:0}
</style>
</head>
<body>
<div class="stage"></div>

<!-- Main text -->
<div class="center clip" data-start="0" data-duration="2.5" data-track-index="1">
  <div class="title" id="title">Keep Data Sorted</div>
  <div class="subtitle" id="subtitle">Binary Search = Lightning Fast Lookups</div>
</div>

<!-- Lower third narration -->
<div class="lower-third clip" data-start="0" data-duration="5" data-track-index="2">
  Remember: keep your data sorted, then binary search does the magic in milliseconds.
</div>

<!-- Outro logo -->
<div class="logo clip" data-start="4" data-duration="1" data-track-index="3">⚡</div>

<script>
  gsap.registerPlugin();

  // TITLE & SUBTITLE
  const tl = gsap.timeline();
  tl.from("#title", {duration:0.5, y:60, opacity:0, ease:"power2.out"}, 0)
    .from("#subtitle", {duration:0.5, y:40, opacity:0, ease:"power2.out"}, 0.2)
    .to("#title, #subtitle", {duration:0.5, opacity:0, ease:"power2.in"}, 2.5);

  // LOGO fade-in
  const logoTl = gsap.timeline();
  logoTl.to(".logo", {duration:1, opacity:1, scale:1.1, ease:"power2.out"}, 0);

  // Register timelines
  window.__timelines = window.__timelines || [];
  window.__timelines.push(tl);
  window.__timelines.push(logoTl);
</script>
</body>
</html>
