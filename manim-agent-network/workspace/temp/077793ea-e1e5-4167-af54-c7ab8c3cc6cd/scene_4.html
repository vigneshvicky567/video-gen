<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scene 4 – Log N</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  body,html{margin:0;padding:0;width:100%;height:100%;background:#0f0f0f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;overflow:hidden}
  #stage{position:relative;width:1920px;height:1080px;background:linear-gradient(140deg,#0f0f0f 0%,#1a1a1a 100%)}
  #formula{position:absolute;top:50%;left:480px;transform:translate(-50%,-50%);font:700 120px/1 "Courier New",monospace;color:#fff}
  #list{position:absolute;top:50%;right:360px;transform:translate(50%,-50%);display:flex;flex-direction:column;gap:24px;width:540px}
  .bullet{background:linear-gradient(90deg,#00ffaa 0%,#00ccff 100%);color:#0f0f0f;font:600 36px/1.3 "Courier New",monospace;padding:18px 32px;border-radius:12px;box-shadow:0 8px 24px rgba(0,255,170,.25)}
  #lowerThird{position:absolute;left:0;bottom:0;width:100%;height:110px;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:600;color:#fff}
</style>
</head>
<body>
<div id="stage">
  <div id="formula" class="clip" data-start="0.3" data-duration="2.5" data-track-index="1">O(log n)</div>

  <div id="list">
    <div class="bullet clip" data-start="1.2" data-duration="1.0" data-track-index="2">1 million items? → ~20 checks</div>
    <div class="bullet clip" data-start="1.4" data-duration="1.0" data-track-index="3">1 billion items? → ~30 checks</div>
  </div>

  <div id="lowerThird" class="clip" data-start="0" data-duration="8" data-track-index="4">
    Worst case? Only log two n steps. Super fast for millions of items.
  </div>
</div>

<script>
  window.__timelines = window.__timelines || [];
  const tl = gsap.timeline({defaults:{ease:"power2.out"}});
  tl.from("#formula",{opacity:0,y:60,duration:0.8})
    .from(".bullet",{opacity:0,y:60,stagger:0.2,duration:0.5});
  window.__timelines.push(tl);
</script>
</body>
</html>
