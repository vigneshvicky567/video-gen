<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scene 1 – Deep Learning in 60 Seconds</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;font-family:'Segoe UI',Helvetica,Arial,sans-serif}
  body{background:#0f0f0f;overflow:hidden}
  .canvas{position:relative;width:1920px;height:1080px;background:linear-gradient(135deg,#0f0f0f 0%,#1a1a3e 40%,#0c1445 100%)}
  .title{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:110px;font-weight:800;color:#ffffff;text-align:center;line-height:1.1;letter-spacing:-2px}
  .subtitle{position:absolute;top:calc(50% + 100px);left:50%;transform:translate(-50%,0);font-size:32px;font-weight:300;color:#a0b4ff;opacity:0}
  .lower-third{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:max-content;max-width:1200px;padding:14px 28px;border-radius:8px;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);color:#ffffff;font-size:24px;font-weight:500;text-align:center;line-height:1.3}
</style>
</head>
<body>
<div class="canvas">
  <div class="title clip" data-start="0" data-duration="2" data-track-index="1">Deep Learning<br>in 60 Seconds</div>
  <div class="subtitle clip" data-start="1" data-duration="2.5" data-track-index="2">by Tech Explainer</div>
  <div class="lower-third clip" data-start="0" data-duration="4" data-track-index="3">Deep learning in one minute—let’s see how machines learn from data.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || [];

  const tl = gsap.timeline();

  // Title: fade in & subtle scale
  tl.fromTo('.title',
    {opacity:0, scale:0.92},
    {opacity:1, scale:1, duration:1.2, ease:'power2.out'},
    0
  );

  // Subtitle: slide up & fade in
  tl.fromTo('.subtitle',
    {y:40, opacity:0},
    {y:0, opacity:1, duration:1.2, ease:'power2.out'},
    1
  );

  // Lower third: fade in
  tl.fromTo('.lower-third',
    {opacity:0, y:20},
    {opacity:1, y:0, duration:1.2, ease:'power2.out'},
    0
  );

  window.__timelines.push(tl);
</script>
</body>
</html>
