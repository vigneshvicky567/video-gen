<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HyperFrames Scene 5</title>
<style>
  body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #stage{position:relative;width:1920px;height:1080px;background:#0f0f0f;overflow:hidden}
  .bullet{font-size:52px;color:#ffffff;font-weight:600;position:absolute;left:160px;opacity:0;transform:translateY(30px)}
  .highlight{position:absolute;width:100%;height:140px;background:linear-gradient(90deg,#00c4cc00 0%,#00c4cc33 60%,#00c4cc00 100%);opacity:0;top:0}
  .lower-third{position:absolute;bottom:0;left:0;width:1920px;height:110px;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;font-size:32px;color:#ffffff;line-height:1.3}
  .logo-box{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.9);opacity:0;text-align:center}
  .logo-box img{width:320px;height:auto}
  .logo-box .sub{font-size:36px;color:#ffffff;margin-top:20px;letter-spacing:1px}
</style>
</head>
<body>
<div id="stage">
  <div class="highlight clip" data-start="0.0" data-duration="0.5" data-track-index="1"></div>
  <div class="highlight clip" data-start="2.0" data-duration="0.5" data-track-index="2"></div>
  <div class="highlight clip" data-start="4.0" data-duration="0.5" data-track-index="3"></div>
  <div class="highlight clip" data-start="6.0" data-duration="0.5" data-track-index="4"></div>

  <div class="bullet clip" style="top:220px" data-start="0.3" data-duration="1.7" data-track-index="5">Layers → depth</div>
  <div class="bullet clip" style="top:370px" data-start="2.3" data-duration="1.7" data-track-index="6">Weights → learned</div>
  <div class="bullet clip" style="top:520px" data-start="4.3" data-duration="1.7" data-track-index="7">Loss → minimized</div>
  <div class="bullet clip" style="top:670px" data-start="6.3" data-duration="1.7" data-track-index="8">Patterns → discovered</div>

  <div class="lower-third clip" data-start="0" data-duration="8" data-track-index="9">
    Stack more layers and you get deep learning—machines that discover patterns we never explicitly taught them.
  </div>

  <div class="logo-box clip" data-start="7.2" data-duration="0.8" data-track-index="10">
    <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMzIwIiBoZWlnaHQ9IjE4MCIgdmlld0JveD0iMCAwIDMyMCAxODAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIzMjAiIGhlaWdodD0iMTgwIiByeD0iMTUiIGZpbGw9IiMwMGZmZmYiLz4KPHN2ZyB4PSI0MCIgeT0iNDAiIHdpZHRoPSIyNDAiIGhlaWdodD0iMTAwIiB2aWV3Qm94PSIwIDAgMjQwIDEwMCIgZmlsbD0ibm9uZSI+CjxyZWN0IHdpZHRoPSI2MCIgaGVpZ2h0PSIxMDAiIGZpbGw9IiMwMDAwMDAiLz4KPHJlY3QgeD0iOTAiIHdpZHRoPSI2MCIgaGVpZ2h0PSIxMDAiIGZpbGw9IiMwMDAwMDAiLz4KPHJlY3QgeD0iMTgwIiB3aWR0aD0iNjAiIGhlaWdodD0iMTAwIiBmaWxsPSIjMDAwMDAwIi8+Cjwvc3ZnPgo8L3N2Zz4K" alt="Logo">
    <div class="sub">Subscribe for more 60-second explainers</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || [];
  const tl = gsap.timeline({defaults:{ease:"power2.out"}});

  tl.fromTo(".highlight[data-track-index='1']",{opacity:0,y:220},{opacity:1,duration:0.4})
    .fromTo(".bullet[data-track-index='5']",{opacity:0,y:30},{opacity:1,y:0,duration:0.6},"-=0.2")
    .to(".highlight[data-track-index='1']",{opacity:0,duration:0.3},"+=1")

    .fromTo(".highlight[data-track-index='2']",{opacity:0,y:370},{opacity:1,duration:0.4})
    .fromTo(".bullet[data-track-index='6']",{opacity:0,y:30},{opacity:1,y:0,duration:0.6},"-=0.2")
    .to(".highlight[data-track-index='2']",{opacity:0,duration:0.3},"+=1")

    .fromTo(".highlight[data-track-index='3']",{opacity:0,y:520},{opacity:1,duration:0.4})
    .fromTo(".bullet[data-track-index='7']",{opacity:0,y:30},{opacity:1,y:0,duration:0.6},"-=0.2")
    .to(".highlight[data-track-index='3']",{opacity:0,duration:0.3},"+=1")

    .fromTo(".highlight[data-track-index='4']",{opacity:0,y:670},{opacity:1,duration:0.4})
    .fromTo(".bullet[data-track-index='8']",{opacity:0,y:30},{opacity:1,y:0,duration:0.6},"-=0.2")
    .to(".highlight[data-track-index='4']",{opacity:0,duration:0.3},"+=1")

    .to(".bullet", {opacity:0,duration:0.4,ease:"power2.in"},"+=0.2")
    .fromTo(".logo-box",{scale:0.8,opacity:0},{scale:1,opacity:1,duration:0.8,ease:"back.out(1.7)"},"+=0.2");

  window.__timelines.push(tl);
</script>
</body>
</html>
