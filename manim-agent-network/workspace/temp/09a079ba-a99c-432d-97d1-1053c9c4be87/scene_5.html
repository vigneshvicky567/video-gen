<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scene 5 – Gradient Descent Recap</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  html,body{margin:0;padding:0;overflow:hidden;font-family:'Segoe UI',Helvetica,Arial,sans-serif;background:#0f0f0f;color:#f0f0f0;}
  #canvas{width:1920px;height:1080px;position:relative;background:radial-gradient(circle at 50% 40%,#1a1a1a 0%,#0f0f0f 80%);}
  .clip{position:absolute;}
  #subtitleBar{left:0;bottom:0;width:1920px;height:120px;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:600;letter-spacing:.6px;color:#ffffff;}
  #leftPanel{left:120px;top:260px;width:840px;}
  .bullet{display:block;font-size:72px;font-weight:600;margin-bottom:60px;opacity:0;transform:translateY(50px);}
  #rightPanel{right:120px;top:320px;width:600px;height:600px;display:flex;align-items:center;justify-content:center;}
  #minimaIcon{width:320px;height:320px;border-radius:50%;background:conic-gradient(from 90deg,#00e0ff,#0080ff,#00e0ff);box-shadow:0 0 60px #00e0ff80;opacity:0;transform:scale(.4);}
  #cta{bottom:160px;right:140px;font-size:54px;font-weight:700;color:#00ffe0;opacity:0;text-shadow:0 0 20px #00ffe0,0 0 40px #00ffe0;transform:translateY(30px);}
</style>
</head>
<body>
<div id="canvas">
  <!-- Left bullet list -->
  <div id="leftPanel">
    <span class="bullet clip" data-start="0.5" data-duration="2.5" data-track-index="1">1. Define loss</span>
    <span class="bullet clip" data-start="1.2" data-duration="2.5" data-track-index="2">2. Compute gradient</span>
    <span class="bullet clip" data-start="1.9" data-duration="2.5" data-track-index="3">3. Update parameters</span>
    <span class="bullet clip" data-start="2.6" data-duration="2.5" data-track-index="4">4. Repeat</span>
  </div>

  <!-- Right minima icon -->
  <div id="rightPanel">
    <div id="minimaIcon" class="clip" data-start="3.8" data-duration="4" data-track-index="5"></div>
  </div>

  <!-- CTA -->
  <div id="cta" class="clip" data-start="8.5" data-duration="6" data-track-index="6">Subscribe for more 60-second AI!</div>

  <!-- Lower-third narration -->
  <div id="subtitleBar" class="clip" data-start="0" data-duration="15" data-track-index="7">That’s gradient descent: follow the slope, find the best model.</div>
</div>

<script>
window.__timelines = window.__timelines || [];

const tl = gsap.timeline();

// Bullets stagger fade+slideUp
tl.to(".bullet", {opacity:1, y:0, duration:1, stagger:0.7, ease:"power2.out"}, 0.5)
  .to("#minimaIcon", {opacity:1, scale:1, duration:1.2, ease:"elastic.out(1,0.5)"}, 3.8)
  .to("#cta", {opacity:1, y:0, duration:1.5, ease:"power2.out"}, 8.5)
  .to("#cta", {textShadow:"0 0 60px #00ffe0,0 0 120px #00ffe0", duration:2, repeat:5, yoyo:true}, 9.5);

window.__timelines.push(tl);
</script>
</body>
</html>
