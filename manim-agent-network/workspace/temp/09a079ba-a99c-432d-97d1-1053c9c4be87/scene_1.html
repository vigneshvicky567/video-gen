<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scene 1 – Gradient Descent in 60 Seconds</title>
<style>
  body,html{margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;font-family:'Segoe UI',Helvetica,Arial,sans-serif}
  .stage{position:absolute;top:0;left:0;width:1920px;height:1080px;background:#0f0f0f}
  .gradient-bg{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0B1C3B 0%,#1E3A8A 100%)}
  .title{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:90px;font-weight:700;color:#ffffff;text-align:center;line-height:1.1;letter-spacing:-2px}
  .title .accent{color:#38bdf8}
  .glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:100%;height:100%;pointer-events:none;opacity:0}
  .glow::before{content:'';position:absolute;top:-20%;left:-20%;width:140%;height:140%;background:radial-gradient(circle,#38bdf8 0%,transparent 70%);filter:blur(120px)}
  .lower-third{position:absolute;bottom:0;left:0;width:1920px;height:100px;background:rgba(0,0,0,0.55);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;font-size:36px;color:#ffffff}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>
<div class="stage">
  <div class="gradient-bg"></div>

  <!-- TITLE -->
  <div class="title clip"
       data-start="0.0"
       data-duration="5.0"
       data-track-index="1">
    Gradient <span class="accent">Descent</span><br>in 60 Seconds
  </div>

  <!-- GLOW -->
  <div class="glow clip"
       data-start="0.0"
       data-duration="5.0"
       data-track-index="2">
  </div>

  <!-- LOWER-THIRD -->
  <div class="lower-third clip"
       data-start="0.0"
       data-duration="5.0"
       data-track-index="3">
    Gradient descent: how AI learns by rolling downhill.
  </div>
</div>

<script>
  window.__timelines = window.__timelines || [];

  const tl = gsap.timeline();

  // title slide‐in & fade
  tl.from('.title', {
    y: -120,
    opacity: 0,
    duration: 1.2,
    ease: 'power2.out'
  })
  // subtle glow fade-in & pulse
  .to('.glow', {opacity:0.45,duration:1.2,ease:'power2.out'},'-=0.3')
  .to('.glow', {opacity:0.2,duration:2.6,ease:'sine.inOut',yoyo:true,repeat:3},'-=0.6');

  window.__timelines.push(tl);
</script>
</body>
</html>
