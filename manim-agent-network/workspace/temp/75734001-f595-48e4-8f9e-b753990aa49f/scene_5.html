<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 5 – Deep Learning Unlocked Outro</title>
  <style>
    html,body{margin:0;padding:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#0f0f0f;color:#fff;overflow:hidden}
    #canvas{position:relative;width:1920px;height:1080px;background:radial-gradient(ellipse at 50% 50%, #1a1a2e 0%, #0f0f0f 70%)}
    .title{font-size:88px;font-weight:700;letter-spacing:-1px;text-align:center;color:#ffffff}
    .underline{position:absolute;height:4px;width:0;background:#00bfff;border-radius:2px}
    .btn{font-size:28px;font-weight:600;border:none;border-radius:8px;padding:18px 48px;cursor:pointer;box-shadow:0 12px 24px rgba(0,191,255,0.35);background:linear-gradient(135deg,#00bfff 0%,#007acc 100%);color:#fff;letter-spacing:.5px}
    .lower-third{position:absolute;left:0;bottom:0;width:100%;height:110px;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
  </style>
</head>
<body>
  <div id="canvas">
    <!-- Title -->
    <div class="clip title" id="title"
         style="position:absolute;top:300px;left:50%;transform:translateX(-50%);opacity:0"
         data-start="0.3" data-duration="1.2" data-track-index="1">
      Deep Learning Unlocked
    </div>

    <!-- Underline -->
    <div class="clip underline" id="underline"
         style="position:absolute;top:400px;left:50%;transform:translateX(-50%)"
         data-start="0.8" data-duration="0.8" data-track-index="2">
    </div>

    <!-- Subscribe button -->
    <button class="clip btn" id="btn1"
            style="position:absolute;top:520px;left:50%;transform:translate(-120%,40px);opacity:0"
            data-start="1.4" data-duration="1.0" data-track-index="3">
      Subscribe
    </button>

    <!-- Next Video button -->
    <button class="clip btn" id="btn2"
            style="position:absolute;top:520px;left:50%;transform:translate(20%,40px);opacity:0"
            data-start="1.5" data-duration="1.0" data-track-index="4">
      Next Video
    </button>

    <!-- Lower third narration bar -->
    <div class="clip lower-third"
         style="opacity:0"
         data-start="0" data-duration="5" data-track-index="5">
      Thanks for watching! Explore more topics and subscribe.
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || [];

    const tl = gsap.timeline();

    // Title fade in
    tl.to("#title", {opacity:1, duration:0.8, ease:"power2.out"}, 0.3);

    // Underline grow
    tl.to("#underline", {width:400, duration:0.8, ease:"power2.out"}, 0.8);

    // Buttons slide up
    tl.to("#btn1", {y:0, opacity:1, duration:0.7, ease:"elastic.out(1.2, 0.75)"}, 1.4);
    tl.to("#btn2", {y:0, opacity:1, duration:0.7, ease:"elastic.out(1.2, 0.75)"}, 1.5);

    // Lower-third fade
    tl.to(".lower-third", {opacity:1, duration:0.6, ease:"power2.out"}, 0);

    window.__timelines.push(tl);
  </script>
</body>
</html>
