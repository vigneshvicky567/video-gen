<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scene 4 – Everywhere Around You</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body,html{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #stage{position:relative;width:1920px;height:1080px;background:#0f0f0f;overflow:hidden}
  .icon-holder{position:absolute;top:200px;width:640px;height:640px;display:flex;align-items:center;justify-content:center}
  .mic-holder{left:0}
  .mri-holder{left:640px}
  .cam-holder{left:1280px}
  svg{overflow:visible}
  .headline{position:absolute;top:920px;left:50%;transform:translateX(-50%);font-weight:700;font-size:64px;color:#e0e0e0;opacity:0}
  .lower-bar{position:absolute;bottom:0;left:0;right:0;height:140px;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
  .lower-text{font-size:36px;color:#ffffff;font-weight:300;max-width:1800px;text-align:center}
</style>
</head>
<body>
<div id="stage">

  <!-- Mic Icon -->
  <div class="icon-holder mic-holder">
    <svg id="micSvg" width="320" height="320" viewBox="0 0 320 320">
      <defs>
        <linearGradient id="micGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#8ed1fc"/>
          <stop offset="100%" stop-color="#a8d8ff"/>
        </linearGradient>
      </defs>
      <!-- Mic body -->
      <rect id="micBody" x="130" y="100" width="60" height="120" rx="30" fill="url(#micGrad)" opacity="0"/>
      <!-- Mic head -->
      <circle id="micHead" cx="160" cy="90" r="40" fill="url(#micGrad)" opacity="0"/>
      <!-- Waves -->
      <g id="waves" opacity="0">
        <path d="M160 180 Q160 220 160 260" stroke="#a8d8ff" stroke-width="4" fill="none"/>
        <path d="M160 180 Q160 220 160 260" stroke="#a8d8ff" stroke-width="4" fill="none" transform="translate(-30,0)"/>
        <path d="M160 180 Q160 220 160 260" stroke="#a8d8ff" stroke-width="4" fill="none" transform="translate(30,0)"/>
      </g>
    </svg>
    <div class="clip" data-start="0.5" data-duration="1" data-track-index="1"></div>
  </div>

  <!-- MRI Icon -->
  <div class="icon-holder mri-holder">
    <svg id="mriSvg" width="320" height="320" viewBox="0 0 320 320">
      <defs>
        <linearGradient id="mriGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#81e6b3"/>
          <stop offset="100%" stop-color="#a8ffc4"/>
        </linearGradient>
      </defs>
      <rect x="80" y="80" width="160" height="160" rx="20" stroke="#a8ffc4" stroke-width="6" fill="none" id="mriOutline" opacity="0"/>
      <g id="mriFill" opacity="0">
        <rect x="100" y="100" width="120" height="120" rx="10" fill="url(#mriGrad)"/>
      </g>
    </svg>
    <div class="clip" data-start="0.5" data-duration="1" data-track-index="2"></div>
  </div>

  <!-- Camera Icon -->
  <div class="icon-holder cam-holder">
    <svg id="camSvg" width="320" height="320" viewBox="0 0 320 320">
      <defs>
        <linearGradient id="camGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffa8e4"/>
          <stop offset="100%" stop-color="#ffc0f0"/>
        </linearGradient>
        <filter id="sparkle" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <!-- Camera body -->
      <rect x="90" y="120" width="140" height="80" rx="10" fill="url(#camGrad)" id="camBody" opacity="0"/>
      <!-- Lens -->
      <circle cx="160" cy="160" r="40" fill="url(#camGrad)" id="camLens" opacity="0"/>
      <!-- Sparkles -->
      <g id="sparkles" opacity="0">
        <circle cx="120" cy="110" r="6" fill="#ffffff"/>
        <circle cx="200" cy="110" r="6" fill="#ffffff"/>
        <circle cx="160" cy="90" r="6" fill="#ffffff"/>
      </g>
    </svg>
    <div class="clip" data-start="0.5" data-duration="1" data-track-index="3"></div>
  </div>

  <!-- Headline -->
  <div id="headline" class="headline clip" data-start="2" data-duration="3" data-track-index="4">Everywhere Around You</div>

  <!-- Lower third -->
  <div class="lower-bar">
    <div class="lower-text">Deep learning powers voice assistants, medical imaging, and even your photo filters.</div>
  </div>

</div>

<script>
window.__timelines = window.__timelines || [];

/* Mic timeline */
const micTl = gsap.timeline({repeat:-1,yoyo:false});
micTl
  .to('#micBody', {opacity:1,duration:0.3,ease:'power2.out'})
  .to('#micHead', {opacity:1,duration:0.3,ease:'power2.out'},'-=0.2')
  .to('#waves', {opacity:1,scaleY:1.2,transformOrigin:'center center',duration:0.4,ease:'sine.inOut'},'-=0.1')
  .to('#waves', {opacity:0,scaleY:0.8,duration:0.3,ease:'sine.in'},'+0.1');

window.__timelines.push(micTl);

/* MRI timeline */
const mriTl = gsap.timeline({repeat:-1,yoyo:false});
mriTl
  .to('#mriOutline', {opacity:1,duration:0.3,ease:'power2.out'})
  .from('#mriFill', {scale:0.5,opacity:0,duration:0.5,ease:'back.out(1.7)'},'-=0.2')
  .to('#mriFill', {opacity:0.4,duration:0.2},'+0.2')
  .to('#mriFill', {opacity:1,duration:0.2});

window.__timelines.push(mriTl);

/* Camera timeline */
const camTl = gsap.timeline({repeat:-1,yoyo:false});
camTl
  .to('#camBody', {opacity:1,duration:0.3,ease:'power2.out'})
  .to('#camLens', {opacity:1,duration:0.3,ease:'power2.out'},'-=0.2')
  .to('#sparkles', {opacity:1,scale:1.2,duration:0.3,stagger:0.1,ease:'sine.inOut'},'-=0.1')
  .to('#sparkles', {opacity:0,scale:0.8,duration:0.3,stagger:0.1,ease:'sine.in'},'+0.2');

window.__timelines.push(camTl);

/* Headline timeline */
const headTl = gsap.timeline();
headTl
  .to('#headline', {opacity:1,y:-50,duration:1,ease:'power3.out'});

window.__timelines.push(headTl);
</script>
</body>
</html>
