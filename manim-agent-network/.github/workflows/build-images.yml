# Prebuild the 7 service images and push to ghcr.io so render runners PULL
# (never build) — cuts per-job minutes. Base is built first; services FROM it.
name: build-images

on:
  push:
    branches: [main, deploy/hybrid-spec]
    paths:
      - "services/**"
      - "shared/**"
      - "infrastructure/docker/**"
      - "requirements.txt"
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase registry
        run: echo "REGISTRY=$(echo $REGISTRY | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      # base first — MUST exist under the local tag `base-manim-agent:latest`
      # because the service Dockerfiles do `FROM base-manim-agent`. A registry-only
      # push would leave the service builds unable to resolve their base.
      - name: Build base (local tag + push)
        run: |
          set -euo pipefail
          docker build -f infrastructure/docker/Dockerfile.base \
            -t base-manim-agent:latest \
            -t "${REGISTRY}/base-manim-agent:latest" .
          docker push "${REGISTRY}/base-manim-agent:latest"

      - name: Build & push services
        run: |
          set -euo pipefail
          for svc in orchestrator script-writer code-generator validator voiceover compositor image-fetcher; do
            echo "::group::build $svc"
            docker build -f "infrastructure/docker/Dockerfile.$svc" \
              -t "${REGISTRY}/$svc:latest" .
            docker push "${REGISTRY}/$svc:latest"
            echo "::endgroup::"
          done

      # web tier (thin, deployed to Azure but also kept in ghcr for parity)
      - name: Build & push web-tier
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/web-tier/Dockerfile
          tags: ${{ env.REGISTRY }}/web-tier:latest
          push: true
