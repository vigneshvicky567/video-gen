version: '3.8'

services:
  base:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.base
    image: base-manim-agent

  orchestrator:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./workspace:/workspace
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - SCRIPT_WRITER_URL=http://script-writer:8001
      - CODE_GENERATOR_URL=http://code-generator:8002
      - VALIDATOR_URL=http://validator:8003
      - VOICEOVER_URL=http://voiceover:8004
      - ASSEMBLER_URL=http://compositor:8005
      - IMAGE_FETCHER_URL=http://image-fetcher:8006
      - COMPOSITOR_LLM_MODEL=${COMPOSITOR_LLM_MODEL:-minimaxai/minimax-m2.7}
    depends_on:
      - base
      - script-writer
      - code-generator
      - validator
      - voiceover
      - compositor
      - image-fetcher

  script-writer:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.script-writer
    ports:
      - "8001:8001"
    volumes:
      - ./workspace:/workspace
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - SCRIPT_WRITER_MODEL=${SCRIPT_WRITER_MODEL:-moonshotai/kimi-k2-instruct}
    depends_on:
      - base

  code-generator:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.code-generator
    ports:
      - "8002:8002"
    volumes:
      - ./workspace:/workspace
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - CODE_GENERATOR_MODEL=${CODE_GENERATOR_MODEL:-moonshotai/kimi-k2-instruct}
    depends_on:
      - base

  validator:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.validator
    ports:
      - "8003:8003"
    volumes:
      - ./workspace:/workspace
    environment:
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
    depends_on:
      - base

  voiceover:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.voiceover
    ports:
      - "8004:8004"
    volumes:
      - ./workspace:/workspace
    environment:
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY}
      - VOICEOVER_PROVIDER=${VOICEOVER_PROVIDER:-dia2}
      - VOICEOVER_FALLBACK_PROVIDER=${VOICEOVER_FALLBACK_PROVIDER:-kokoro}
      - ALLOW_ESPEAK_FALLBACK=${ALLOW_ESPEAK_FALLBACK:-false}
      - DIA2_MODEL=${DIA2_MODEL:-nari-labs/Dia2-1B}
      - DIA2_DEVICE=${DIA2_DEVICE:-cuda}
      - DIA2_DTYPE=${DIA2_DTYPE:-bfloat16}
      - DIA2_CFG_SCALE=${DIA2_CFG_SCALE:-2.0}
      - DIA2_TEMPERATURE=${DIA2_TEMPERATURE:-0.8}
      - KOKORO_MODEL_PATH=${KOKORO_MODEL_PATH:-/models/kokoro/kokoro-v1.0.int8.onnx}
      - KOKORO_VOICES_PATH=${KOKORO_VOICES_PATH:-/models/kokoro/voices-v1.0.bin}
      - KOKORO_VOICE=${KOKORO_VOICE:-af_sarah}
      - KOKORO_SPEED=${KOKORO_SPEED:-1.0}
      - KOKORO_LANG=${KOKORO_LANG:-en-us}
    depends_on:
      - base

  image-fetcher:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.image-fetcher
    ports:
      - "8006:8006"
    volumes:
      - ./workspace:/workspace
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - PEXELS_API_KEY=${PEXELS_API_KEY}
    depends_on:
      - base

  compositor:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.compositor
    ports:
      - "8005:8005"
    volumes:
      - ./workspace:/workspace
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - COMPOSITOR_LLM_MODEL=${COMPOSITOR_LLM_MODEL:-minimaxai/minimax-m2.7}
    depends_on:
      - base

volumes:
  workspace:
